[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lol-matchup-checker"
version = "2.1.1"
description = "Scrapes League of Legends matchup win rates from u.gg (through Cloudflare, via Scrapling) into an Excel sheet."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "MrVaxiZ"}]
requires-python = ">=3.10"
dependencies = [
    "scrapling[fetchers]>=0.4.15",
    "openpyxl>=3.1",
    "Pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
lol-matchup = "lol_matchup_checker.cli:main"
lol-counters = "lol_matchup_checker.counters:main"

[project.gui-scripts]
lol-matchup-gui = "lol_matchup_checker.gui:main"

[tool.setuptools]
packages = ["lol_matchup_checker"]

[tool.setuptools.package-data]
lol_matchup_checker = ["assets/*.png"]
